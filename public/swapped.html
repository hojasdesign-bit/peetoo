<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comprar con Swapped | peetoo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #101010;
    font-family: system-ui, -apple-system, sans-serif;
  }
  /* Escenario como el del clon de swapped.com/trade: widget centrado,
     400px de ancho, con la misma colocación (flex centrado, padding
     40px 20px 60px). El alto del iframe deja ver el widget entero: el
     widget real llena su contenedor y forzar el alto del clon (484px)
     cortaría el botón de compra. */
  .stage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 60px;
  }
  iframe {
    width: 400px;
    max-width: 100%;
    height: 720px;
    border: 0;
    border-radius: 28px;
    background: #fff;
  }
  .back {
    position: absolute;
    top: 20px;
    left: 20px;
    color: #a3a3a3;
    font-size: 14px;
    text-decoration: none;
  }
  .back:hover { color: #fff; }
</style>
</head>
<body>
  <a class="back" href="/">← Volver a peetoo</a>
  <main class="stage">
    <iframe src="https://widget.swapped.com/?currencyCode=BTC" title="Widget de Swapped" allow="clipboard-write"></iframe>
  </main>
</body>
</html>
